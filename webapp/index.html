<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toolkit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="topbar">
            <h1 id="view-title">Toolkit</h1>
            <button class="icon-btn" id="btn-settings" aria-label="Settings"><i data-lucide="settings-2"></i></button>
        </div>

        <!-- HOME -->
        <main id="home-view">
            <div class="search-wrap">
                <i data-lucide="search" class="s-ico"></i>
                <input class="search-input" id="search" type="text" placeholder="Search tools…" autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>
            <div class="chips" id="cat-bar"></div>
            <div id="home-sections"></div>
        </main>

        <!-- DETAIL -->
        <section id="detail-view" class="hidden">
            <div class="detail-head">
                <button class="icon-btn" id="btn-back" aria-label="Back"><i data-lucide="chevron-left"></i></button>
                <div class="meta">
                    <h2 id="detail-title">Tool</h2>
                    <p id="detail-desc"></p>
                </div>
                <button class="icon-btn fav-toggle" id="btn-fav" aria-label="Favorite"><i data-lucide="star"></i></button>
            </div>
            <div id="detail-body"></div>
        </section>

        <!-- SETTINGS -->
        <section id="settings-view" class="hidden"></section>
    </div>

    <div id="toast-host"></div>
    <script src="script.js"></script>
</body>
</html>
