<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toolkit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1 id="view-title">Tools</h1>
        </header>

        <main id="grid-view">
            <div class="tool-grid" id="tool-grid"></div>
        </main>

        <section id="detail-view" class="hidden">
            <div class="detail-head">
                <button class="back-btn" id="back-btn"><i data-lucide="chevron-left"></i></button>
                <div>
                    <h2 id="detail-title">Tool</h2>
                    <p id="detail-desc"></p>
                </div>
            </div>
            <div id="detail-body"></div>
        </section>

        <section id="settings-view" class="hidden"></section>

        <nav class="tab-bar">
            <button class="tab" data-tab="tools"><i data-lucide="wrench"></i><span>Tools</span></button>
            <button class="tab" data-tab="network"><i data-lucide="globe"></i><span>Network</span></button>
            <button class="tab" data-tab="media"><i data-lucide="clapperboard"></i><span>Media</span></button>
            <button class="tab" data-tab="settings"><i data-lucide="settings"></i><span>Settings</span></button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
